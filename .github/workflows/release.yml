name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild AudioInOut/AudioInOut.csproj /p:Configuration=Release /p:Platform=x86 /m
      - name: Package
        shell: pwsh
        run: |
          Copy-Item Build/Release/AudioInOut.exe .
          # zip = exe + translations (satellite resource folders)
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item Build/Release/AudioInOut.exe, Build/Release/AudioInOut.exe.config stage/
          Copy-Item (Get-ChildItem Build/Release -Directory).FullName stage/ -Recurse
          Compress-Archive -Path stage/* -DestinationPath AudioInOut-translations.zip
      - name: Installer
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+)') { $Matches[1] } else { '0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer/AudioInOut.iss
          Move-Item Output/AudioInOut-Setup.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: AudioInOut
          path: |
            AudioInOut.exe
            AudioInOut-translations.zip
            AudioInOut-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AudioInOut
      - name: Draft release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" AudioInOut-Setup.exe AudioInOut.exeAudioInOut-translations.zip --draft --title "AudioInOut ${{ github.ref_name }}" --generate-notes
