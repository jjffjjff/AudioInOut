name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - run: msbuild AudioInOut/AudioInOut.csproj /p:Configuration=Release /p:Platform=x86 /m
      - name: Package
        shell: pwsh
        run: |
          Copy-Item Build/Release/AudioInOut.exe .
          # zip = exe + translations (satellite resource folders)
          Compress-Archive -Path Build/Release/AudioInOut.exe, Build/Release/AudioInOut.exe.config, (Get-ChildItem Build/Release -Directory) -DestinationPath AudioInOut-translations.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AudioInOut
          path: |
            AudioInOut.exe
            AudioInOut-translations.zip
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" AudioInOut.exe AudioInOut-translations.zip --draft --title "AudioInOut ${{ github.ref_name }}" --generate-notes
